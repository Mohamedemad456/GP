services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./packages/design-system:/app/packages/design-system
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  design-system-storybook:
    build:
      context: .
      dockerfile: packages/design-system/Dockerfile
    working_dir: /app/packages/design-system
    ports:
      - "6006:6006"
    volumes:
      - ./packages/design-system:/app/packages/design-system
    command: sh -c "npm install && npm run storybook -- --host 0.0.0.0 --no-open"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

      
  # =======================
  # AI Service (FastAPI)
  # =======================
  ai-service:
    container_name: karna_ai_service
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # =======================
  # Backend (.NET API)
  # =======================
  backend:
    container_name: karna_backend
    build:
      context: ./backend/KARNA
      dockerfile: Karna.APIs/Dockerfile
    ports:
      - "9090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Server=db;Database=KarnaDb;User=sa;Password=Karna@Pass123;TrustServerCertificate=True
    depends_on:
      - db

  # =======================
  # Database (SQL Server)
  # =======================
  db:
    container_name: karna_db
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Karna@Pass123"
    ports:
      - "1433:1433"
    volumes:
      - karna_db_data:/var/opt/mssql

volumes:
  karna_db_data:


services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./packages/design-system:/app/packages/design-system
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

  design-system-storybook:
    build:
      context: .
      dockerfile: packages/design-system/Dockerfile
    working_dir: /app/packages/design-system
    ports:
      - "6006:6006"
    volumes:
      - ./packages/design-system:/app/packages/design-system
    command: sh -c "npm install && npm run storybook -- --host 0.0.0.0 --no-open"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true


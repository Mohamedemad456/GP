# canonical_rules.yaml
# NOTE: Model hierarchy normalization is OUT OF SCOPE (BMW 318i vs 320i treated as distinct).

make_aliases:
  chana: Changan
  kgm: SsangYong
  bmw: BMW
  vw: Volkswagen

model_aliases_by_make:
  Honda:
    cr v: CRV
    crv: CRV
  MG:
    rx5: RX5
    rx 5: RX5
  Nissan:
    xtrail: X-Trail
    x trail: X-Trail
  Suzuki:
    grand vitara: Grand Vitara
    s presso: S-Presso
  Isuzu:
    d max: D-Max
  DS:
    ds4: DS4
    ds7: DS7
  BAIC:
    u5 plus: U5 Plus
  Geely:
    cool ray: Coolray

wrong_pair_fixes:
  - wrong_make: Toyota
    wrong_model: Cruze
    correct_make: Chevrolet
    correct_model: Cruze
  - wrong_make: Volkswagen
    wrong_model: Tiggo
    correct_make: Chery
    correct_model: Tiggo
  - wrong_make: Ford
    wrong_model: Echo
    correct_make: Toyota
    correct_model: Echo
  - wrong_make: Fiat
    wrong_model: Polo
    correct_make: Volkswagen
    correct_model: Polo
  - wrong_make: Fiat
    wrong_model: Jetta
    correct_make: Volkswagen
    correct_model: Jetta
  - wrong_make: Suzuki
    wrong_model: Fit
    correct_make: Honda
    correct_model: Fit
  - wrong_make: Mini
    wrong_model: Benni
    correct_make: Changan
    correct_model: Benni

flag_for_deletion:
  - make: Hyundai
    model: X3
    reason: "X3 is a BMW model. No Hyundai X3 exists."
  - make: Mercedes
    model: A1
    reason: "A1 is not a Mercedes model label."
  - make: Hyundai
    model: A1
    reason: "A1 is not a Hyundai model label."
  - make: Chevrolet
    model: "300"
    reason: "300 is a Chrysler model. No Chevrolet 300 target."
  - make: Kia
    model: Saipa
    reason: "Saipa is a car manufacturer, not a Kia model."
  - make: Suzuki
    model: Maruti
    reason: "Maruti is a brand (Maruti Suzuki India), not a model."
  - make: Renault
    model: Rainbow
    reason: "No known Renault Rainbow exists globally or in Egyptian market."
  - make: Skoda
    model: Fantasia
    reason: "No known Skoda Fantasia. Possibly meant Skoda Fabia."
  - make: Suzuki
    model: Rio
    reason: "Rio is a Kia model. Likely wrong make assignment."
  - make: Daihatsu
    model: Rio
    reason: "Rio is a Kia model. Likely wrong make assignment."

valid_exceptions:
  - make: Chevrolet
    model: Lanos
    note: "Valid Egypt-market rebadge of Daewoo Lanos."
  - make: Daewoo
    model: Lanos
    note: "Valid original."
  - make: Seat
    model: Leon
    note: "Valid. Cupra spun off from Seat."
  - make: Cupra
    model: Leon
    note: "Valid post-spinoff brand."
  - make: SsangYong
    model: Torres
    note: "Valid. KGM alias collapses to SsangYong."
  - make: Fiat
    model: Shahin
    note: "Egypt-market Nasr/Fiat/Tofas lineage. Keep."
  - make: Fiat
    model: Dogan
    note: "Tofas/Fiat lineage. Keep."
  - make: Fiat
    model: Petra
    note: "Tofas/Fiat lineage. Keep."
  - make: Speranza
    model: Chery QQ
    note: "Egypt-market Speranza assembled Chery QQ. Valid."
  - make: Dodge
    model: Ram
    note: "Pre-brand-split listing. Valid for Egyptian used car market."



# ============================================================
# ADD THIS ENTIRE SECTION to the bottom of canonical_rules.yaml
# ============================================================
#
# model_family_map
# ----------------
# Maps (make, model variant) → model family name.
#
# Design decisions:
#   - The `model` column is NEVER changed. BMW 318i stays "318i".
#   - A new `model_family` column is ADDED alongside it: "3 Series".
#   - model is used for ML pricing features (granularity preserved).
#   - model_family is used for grouping, search, and filtering.
#   - If a (make, model) has no entry here, model_family = model.
#
# NOTE: Model variants that are already normalized to the same string
# by model_aliases_by_make (e.g., Honda CRV / Cr V → CRV) do NOT need
# entries here — they are a single model after canonicalization.
#
# NOTE: BMW X1, X2, X3, X4, X5, X6, X7 are kept as separate families
# because they are distinct vehicle lines at different size/price points.
# Only performance variants (X3 M, X5 M, X6 M) share a family with
# their base model.
# ============================================================

model_family_map:

  # ---------- BMW ----------
  BMW:
    # 1 Series
    "116": "1 Series"
    "118": "1 Series"
    # 2 Series
    "218":  "2 Series"
    "218i": "2 Series"
    # 3 Series
    "3 Series": "3 Series"
    "316":  "3 Series"
    "318":  "3 Series"
    "318i": "3 Series"
    "320":  "3 Series"
    "320i": "3 Series"
    "330":  "3 Series"
    "340":  "3 Series"
    # 4 Series
    "418": "4 Series"
    "420": "4 Series"
    # 5 Series
    "520":  "5 Series"
    "520i": "5 Series"
    "523":  "5 Series"
    "525":  "5 Series"
    "528":  "5 Series"
    "530":  "5 Series"
    # 7 Series
    "740": "7 Series"
    # X families — performance variants share base family
    "X3":   "X3"
    "X3 M": "X3"
    "X5":   "X5"
    "X5 M": "X5"
    "X6":   "X6"

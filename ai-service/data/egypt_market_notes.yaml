kia_grand_cerato:
  notes: |
    EGYPT MARKET STATUS: This is the 2019+ Cerato generation. Also listed separately in CSV as "Grand Cerato." See kia_cerato notes for full detail. Key additions: CVT is explicitly labeled on this generation. Premium interior over K3. Best resale of any Cerato generation. SV trim is the sweet spot.

# ────────────────────────────────────────────────────────────────────────────
# CHERY — Model-Specific Entries
# ────────────────────────────────────────────────────────────────────────────

chery_tiggo_4_pro:
  notes: |
    EGYPT MARKET STATUS: One of Chery's best-selling compact SUVs in Egypt. Competes directly with Hyundai Creta and MG ZS at a lower price. The "Pro" suffix marks a significant quality jump over pre-2020 Chery.
    ENGINE: 1.5L Turbo petrol, ~147 hp.
    TRANSMISSION: CVT (most common for city use) or 6-speed DCT.
    WARRANTY: 6 years / 150,000 km — the longest warranty in its segment, a key selling point.
    PROS: Excellent price-to-features ratio (panoramic roof, large screen, 360 camera at entry price), spacious for its class, improving Chery build quality, strong warranty.
    CONS: CVT can feel strained under hard acceleration; DCT judder in stop-go traffic; infotainment system can lag; interior hard plastics; resale still establishing.
    USER COMPLAINTS: Higher-than-expected city fuel consumption (10-11 L/100km). AC performance adequate but not dominant in extreme Cairo summer. Some owners report early suspension bushing wear on rough roads.
    USER FEEDBACK: "اسعارها مش معقولة وفيها كل حاجة" — unbelievable price for everything included. "الضمان 6 سنين بيدي راحة بال" — 6-year warranty gives peace of mind.
    BUYING ADVICE: The sweet spot is the CVT trim for city use. Always buy from authorized Chery dealer for warranty. 2023+ models have better infotainment. Confirm CVT fluid is in service schedule.

chery_tiggo_7_pro:
  notes: |
    EGYPT MARKET STATUS: Popular family SUV competing with Kia Sportage and Hyundai Tucson at lower price. Significantly better than older Chery models. Strong seller among families who want SUV at sedan price.
    ENGINE: 1.5L Turbo petrol, ~147-156 hp.
    TRANSMISSION: CVT or 7-speed DCT depending on trim.
    PROS: Loaded with premium features (panoramic sunroof, large dual screens, wireless charging), spacious 5-seater, comfortable ride, 5-year warranty.
    CONS: Turbo engine requires quality 5W-30 synthetic oil and regular changes; DCT can be jerky in traffic; resale lower than Korean equivalents; parts network still developing.
    USER COMPLAINTS: DCT "نتشة" (jerk) at low speeds in traffic. Fuel consumption higher than advertised (10-12 L/100km city). Infotainment occasional freezes. Some interior rattles on rough roads.
    USER FEEDBACK: "بتاخد تجهيزات 500 ألف بـ 300 ألف" — gets 500k features for 300k. "الفتيس DCT بيضايق في الزحمة" — DCT bothers you in traffic.
    BUYING ADVICE: CVT version is better for pure city driving. Only consider DCT if you do significant highway driving. Service turbo oil on schedule — non-negotiable.

chery_tiggo_8_pro:
  notes: |
    EGYPT MARKET STATUS: Chery's flagship 7-seater SUV. Offers genuine 7-seat capability at a price point well below Korean/Japanese equivalents. Growing popularity with large families.
    ENGINE: 2.0L Turbo petrol, 254 hp.
    TRANSMISSION: 7-speed DCT.
    PROS: Powerful engine (fastest in Chinese SUV segment), genuine 3-row 7-seater, very spacious interior, premium look and features, strong resale trajectory as brand trust builds.
    CONS: High fuel consumption (12-14 L/100km city with AC); DCT low-speed judder in Cairo traffic; large body (4720mm) makes parking difficult; third-row adults-only for short trips; parts more expensive than smaller Chery models.
    USER COMPLAINTS: "بتشرب بنزين تقيل" — drinks heavy fuel. DCT hesitation first thing in the morning (cold). Third-row access tight. Reverse camera quality could be better.
    BUYING ADVICE: Best value 7-seater if you frequently carry 7. Buy new for warranty. Budget for higher fuel costs than a 1.5L SUV. Max trim is worth the premium for the equipment level.

chery_arrizo_5:
  notes: |
    EGYPT MARKET STATUS: Chery's mainstream budget sedan, directly competing with Nissan Sunny and Hyundai Accent. Hugely popular for ride-hailing and first-car buyers.
    ENGINE: 1.5L petrol, 114 hp.
    TRANSMISSION: CVT or 5-speed Manual.
    FUEL ECONOMY: 7-8 L/100km city — competitive for the segment.
    PROS: Very competitive price, modern interior for the money, good fuel economy, spacious rear seat, practical trunk, decent feature set including camera.
    CONS: CVT must be serviced (40-60k km fluid change) or it deteriorates; road noise noticeable at highway speeds; interior hard plastics; lower resale than Japanese/Korean.
    USER FEEDBACK: "اقتصادية وفيها تجهيزات معقولة" — economical with reasonable features. "مش هيوجعك دماغك" — won't give you headaches. "البيع بعدين تقيل شوية" — resale is a bit tough later.
    BUYING ADVICE: Manual version is more reliable and simpler long-term. CVT is fine if serviced. Good honest budget car. Buy 2022+ Arrizo 5 Pro if possible — better build quality and features.

chery_arrizo_5_pro:
  notes: |
    EGYPT MARKET STATUS: Upgraded version of Arrizo 5. Better features, styling, and interior quality. Same platform but significantly improved perception.
    ENGINE: 1.5L petrol, 114 hp.
    TRANSMISSION: CVT.
    NOTES: Same CVT maintenance requirements as Arrizo 5. Better suited for buyers who want more features. The Pro model has better resale prospects than the base Arrizo 5.
    BUYING ADVICE: If choosing between Arrizo 5 and 5 Pro, the Pro is worth the slight price premium. Same core advice applies — service CVT on schedule.

# ────────────────────────────────────────────────────────────────────────────
# MG — Expanded Coverage
# ────────────────────────────────────────────────────────────────────────────

mg_one:
  notes: |
    EGYPT MARKET STATUS: MG's sporty compact SUV, positioned above the ZS. Aimed at younger buyers wanting turbo power and futuristic design. Growing market.
    ENGINE: 1.5L Turbo petrol, 181 hp — significantly more powerful than MG ZS.
    TRANSMISSION: CVT.
    PROS: Strong turbo performance for the price, futuristic dual-screen interior, sportier handling than ZS, modern design.
    CONS: Higher fuel consumption than ZS due to turbo (10-12 L/100km city); turbo requires quality synthetic oil; long-term reliability less proven than ZS; resale less established.
    USER FEEDBACK: "شكلها مختلف ومتميز" — its look is different and distinctive. "بتسحب احسن من الـ ZS بكتير" — pulls much better than the ZS. "بتاكل بنزين اكتر" — eats more fuel.
    BUYING ADVICE: Buy if you want performance over fuel economy. Ensure turbo oil changes are done every 5,000-7,000 km with quality oil.

mg_rx5:
  notes: |
    EGYPT MARKET STATUS: MG's mid-size SUV competing with Kia Sportage and Hyundai Tucson. Offers good space and features at competitive price.
    ENGINE: 1.5L Turbo petrol, 169-171 hp.
    TRANSMISSION: 7-speed DCT.
    PROS: Spacious cabin, premium interior feel, large panoramic sunroof, good feature set, stronger engine than ZS.
    CONS: DCT hesitation and judder in Cairo stop-go traffic (common complaint); fuel consumption 10-12 L/100km city; resale less established than Korean rivals; DCT fluid must be serviced.
    USER COMPLAINTS: "الفتيس بينطر في الزحمة" — gearbox jerks in traffic. This is the #1 complaint. AC is strong but fuel consumption surprises some buyers.
    BUYING ADVICE: Test drive extensively in traffic — the DCT behavior is a personal tolerance decision. Buy from authorized dealer for warranty. DCT fluid service is mandatory.

mg_7:
  notes: |
    EGYPT MARKET STATUS: MG's large executive-class sedan. Premium positioning for MG brand. Less common but serves buyers wanting Chinese luxury at lower price than European alternatives.
    ENGINE: 1.5T or 2.0T petrol depending on variant.
    TRANSMISSION: 8-speed Automatic.
    PROS: Executive-sized sedan at competitive price, high quality interior for MG, smooth 8-speed automatic, good features.
    CONS: Brand perception still below European equivalents in this segment, parts network still developing for this model, resale less established.
    BUYING ADVICE: Good value executive sedan if you're brand-flexible. Buy from authorized dealer.

# ────────────────────────────────────────────────────────────────────────────
# BAIC
# ────────────────────────────────────────────────────────────────────────────

baic_u5_plus:
  notes: |
    EGYPT MARKET STATUS: Budget compact sedan growing rapidly in the Egyptian market. Often the cheapest new Chinese sedan available. Competes with BYD F3 and Chery Arrizo.
    ENGINE: 1.5L petrol, 109-113 hp.
    TRANSMISSION: CVT or 5-speed Manual.
    PROS: Very affordable purchase price, surprisingly modern interior features (large screen, camera), decent space, good fuel economy (7-8 L/100km).
    CONS: Brand still building trust in Egypt — weakest brand recognition of Chinese brands here; parts availability and resale are major unknowns; CVT longevity concern if neglected; no long service track record yet.
    USER FEEDBACK: "ارخص عربية صينية جديدة" — cheapest new Chinese car. "خايف من بيعها بعدين" — worried about selling it later. That resale fear is valid.
    BUYING ADVICE: Viable only if buying new with full warranty and planning to keep long-term. Do not buy used BAIC without knowing full history — no established mechanic network yet. Manual version safer.

# ────────────────────────────────────────────────────────────────────────────
# JETOUR
# ────────────────────────────────────────────────────────────────────────────

jetour_x70_plus:
  notes: |
    EGYPT MARKET STATUS: Budget 7-seater SUV. Locally assembled. Competes with Toyota Avanza and Mitsubishi Xpander on price but as a larger SUV body. Popular for families needing 7 seats on tight budget.
    ENGINE: 1.5L or 1.6L Turbo petrol, 156-197 hp depending on trim.
    TRANSMISSION: 6-speed DCT or 8-speed Automatic (varies by year/trim).
    PROS: One of the cheapest new 7-seater SUVs in Egypt, stylish design for price, good feature set, local assembly reduces maintenance cost vs import.
    CONS: Brand very new — resale and long-term reliability unknown; DCT can be jerky; 7th seat is emergency-only; fuel consumption with full load is high; parts network still developing.
    USER FEEDBACK: "أرخص 7 راكب بشكل حلو" — cheapest 7-seater with a good look. "الماتور قوي" — the engine is powerful (turbo trims).
    BUYING ADVICE: The 8-speed automatic trim is significantly better than DCT for city use — worth finding. Buy new only. Do not buy used without full history.

# ────────────────────────────────────────────────────────────────────────────
# CHANGAN — Additional Models
# ────────────────────────────────────────────────────────────────────────────

changan_cs55_plus:
  notes: |
    EGYPT MARKET STATUS: Mid-size Chinese SUV competing with Tucson/Sportage. More premium positioning than Haval Jolion or MG ZS. Growing market share.
    ENGINE: 1.5L Turbo petrol, 156-180 hp depending on variant.
    TRANSMISSION: 7-speed DCT.
    PROS: Higher interior quality than most Chinese competitors at similar price, quiet cabin, advanced safety features, refined feel.
    CONS: DCT judder in stop-go traffic (same concern as other DCT brands); fuel economy disappointing in city (10-12 L/100km); resale weaker than Korean brands; parts supply developing.
    USER FEEDBACK: "جوها احلي من غيرها بنفس السعر" — its interior is better than others at the same price. "الفتيس DCT مش مريح في القاهرة" — DCT not comfortable in Cairo.
    BUYING ADVICE: Worth considering if interior quality is priority. Test DCT thoroughly before buying. Severe DCT service schedule required.

changan_cs35:
  notes: |
    EGYPT MARKET STATUS: Changan's entry compact SUV. Budget crossover for city use.
    ENGINE: 1.4L Turbo petrol, ~116 hp.
    TRANSMISSION: Manual or CVT.
    PROS: Affordable compact SUV entry, decent fuel economy, city-friendly size.
    CONS: Small engine can be underpowered; limited features vs. Tiggo 4 Pro at similar price; resale lower.
    BUYING ADVICE: Only consider over Tiggo 4 Pro if size/budget is a strict constraint. The Pro lineup from Chery offers more value at similar prices.

# ────────────────────────────────────────────────────────────────────────────
# TOYOTA — Additional Models
# ────────────────────────────────────────────────────────────────────────────

toyota_corolla_cross:
  notes: |
    EGYPT MARKET STATUS: Toyota's compact crossover. A massive hit — offers Toyota's legendary reliability in a modern, slightly raised body. One of the best-selling new cars in Egypt.
    ENGINE: 1.8L petrol (122hp) or 1.8L Hybrid.
    TRANSMISSION: CVT (petrol) or e-CVT (hybrid).
    HYBRID: The hybrid version (الهجين) delivers exceptional fuel economy in Cairo traffic — 5-6 L/100km vs 8-10L for petrol. The difference is massive for high-mileage drivers.
    PROS: Toyota reliability guarantee, excellent resale (same "شيك في البنك" reputation as Corolla), comfortable, good features, raised ride height better for rough roads.
    CONS: Expensive compared to Chinese rivals; petrol CVT can be noisy under hard acceleration; hybrid commands significant premium; waiting lists common.
    USER FEEDBACK: "توقعت تكون احسن من الكورولا بس السعر مش مريح" — expected better than Corolla but price isn't comfortable. Hybrid owners: "بنزين مش موجود تقريباً في الزحمة" — barely uses petrol in traffic.
    BUYING ADVICE: Hybrid is the definitive choice if you drive 30,000+ km/year in Cairo — fuel savings recoup the premium in 2-3 years. Petrol version is still excellent but check CVT service schedule.

toyota_rush:
  notes: |
    EGYPT MARKET STATUS: Budget 7-seater SUV-styled MPV. Toyota brand at affordable price point. Competes with Mitsubishi Xpander and Suzuki Ertiga.
    ENGINE: 1.5L petrol, ~103 hp.
    TRANSMISSION: 4-speed Automatic or 5-speed Manual.
    PROS: Toyota reliability badge at affordable price, decent ground clearance, 7-seater, practical.
    CONS: Very underpowered with 7 people (especially in heat with AC on); 4-speed auto is dated and lazy; basic interior; not as comfortable as Avanza on rough roads.
    USER FEEDBACK: "اسم تويوتا بخلفيه بس متبقاش ماشي 7 ناس" — Toyota name on the back but don't drive with 7 people.
    BUYING ADVICE: Buy manual if possible — the 4AT is too slow. Good for light family use, avoid heavy commercial/full-load use.

toyota_c_hr:
  notes: |
    EGYPT MARKET STATUS: Toyota's polarizing crossover coupe. Niche but growing market. Younger buyers love the distinctive styling.
    ENGINE: 1.2L Turbo petrol or 1.8L Hybrid depending on year.
    TRANSMISSION: CVT.
    PROS: Unique styling unlike anything else in the market, Toyota reliability, good fuel economy especially hybrid, premium interior materials.
    CONS: Very poor rear visibility (the worst of any mainstream car), cramped rear seats and limited cargo due to coupe roofline, expensive for what it offers mechanically.
    USER FEEDBACK: "شكلها تحفة من بره وسجن من جوه الخلف" — looks amazing outside and prison-like in the back. Very common sentiment.
    BUYING ADVICE: Only buy if the exterior styling is your priority. Test the rear seat and visibility before committing.

# ────────────────────────────────────────────────────────────────────────────
# BMW — Egyptian Used Market Coverage
# ────────────────────────────────────────────────────────────────────────────

bmw_3_series:
  notes: |
    EGYPT MARKET STATUS: The most iconic used luxury sedan in Egypt. E90 (2005-2012) and F30 (2012-2019) are common. A status symbol that requires serious maintenance budget.
    VARIANTS IN EGYPT: 316i (1.6L), 318i (1.8L), 320i (2.0L — most common), 328i, 330i.
    ENGINE: 1.6L N13 (316), 2.0L N20/B48 (318/320), 3.0L N55 (330).
    TRANSMISSION: 6-speed ZF (E90) or 8-speed ZF (F30) — both excellent transmissions.
    KEY KNOWN ISSUES:
      E90 (2005-2012): Electric water pump failure (critical — can cause overheating, 3,000-5,000 EGP), valve cover gasket leaks, VANOS solenoid issues, oil filter housing gasket.
      F30 320i pre-2015 (N20 engine): Timing chain tensioner failure — catastrophic if ignored. The N20 timing chain is THE critical issue to check on F30 models before 2015. Costs 15,000-25,000 EGP to fix properly.
      F30 320i post-2015 (B48 engine): Significantly more reliable. This is the sweet spot.
    PROS: Superb driving dynamics (best handling of any popular used car), premium interior, strong enthusiast community and specialist workshops, excellent ZF transmissions.
    CONS: Very expensive maintenance compared to Japanese/Korean; timing chain risk on pre-2015 N20; requires premium 95+ fuel; any failure can cost 10,000-40,000 EGP; resale can be slow if car has history.
    USER FEEDBACK: "لما بتمشي بتمشي زي القطر" — when it runs it runs like a train. "محتاجة جيب ورا جيب" — needs a pocket behind a pocket (classic Egyptian saying). "سواقتها حاجة تانية خالص" — driving it is something else entirely.
    BUYING ADVICE: NEVER buy without pre-purchase inspection at BMW specialist (1,500-2,000 EGP, worth every piaster). F30 post-2015 (B48) is the safest choice. Check timing chain report on ALL N20 engines. Budget 20,000-30,000 EGP annually for maintenance minimum.

bmw_x1:
  notes: |
    EGYPT MARKET STATUS: Popular used luxury compact SUV. Offers BMW badge with more practical dimensions than 3 Series.
    VARIANTS IN EGYPT: E84 (2009-2015), F48 (2015-2022). E84 is older and more manual-feeling; F48 is more modern.
    ENGINE: 1.5L 3-cylinder (sDrive18i, B38) or 2.0L 4-cylinder (sDrive20i/xDrive20i, B48).
    TRANSMISSION: 7-speed DCT (E84 some) or 8-speed Aisin Automatic (F48).
    KNOWN ISSUES: E84: same E90-era engine issues. F48 with B38 (3-cylinder): can be rough and vibrates more than 4-cylinder, some owners dislike it. B48 (2.0L) is the smooth reliable option.
    PROS: More practical than 3 Series for families, BMW driving dynamics in SUV form, 8-speed auto on F48 is excellent, good resale in used market.
    CONS: Expensive maintenance, 3-cylinder B38 is controversial, premium fuel required, requires specialist.
    USER FEEDBACK: "عملية اكتر من الـ 3 سيريز" — more practical than the 3 Series. "الـ 18i دي 3 سلندر محسسهاش كويس" — the 18i 3-cylinder doesn't feel good.
    BUYING ADVICE: Always go for the 20i (B48) over 18i (B38). F48 generation preferred over E84. Pre-purchase inspection mandatory.

# ────────────────────────────────────────────────────────────────────────────
# MERCEDES — C-Class and E-Class Coverage
# ────────────────────────────────────────────────────────────────────────────

mercedes_c180:
  notes: |
    EGYPT MARKET STATUS: The entry point for Mercedes ownership in Egypt. The C180 (and C200) are the most common Mercedes models on Egyptian roads. W204 (2007-2014) and W205 (2014-2021) generations dominate the used market.
    APPLIES TO: C180, C200, C250, C300 — all C-Class variants share most characteristics.
    ENGINE: 1.6L Turbo M274 (C180/C200 newer), 1.8L Kompressor M271 (C200 older), 2.0L M274.
    TRANSMISSION: 7G-Tronic (7AT) or 9G-Tronic (9AT) — both generally reliable.
    KEY KNOWN ISSUES:
      W204 M271 engine (2007-2012 C200): Timing chain stretch and camshaft adjuster failure — listen for rattling on cold start. Expensive fix: 20,000-40,000 EGP.
      W204 Electronic Steering Lock (ESL): Can fail and immobilize the car. Common issue. 5,000-8,000 EGP to fix.
      W205 2015-2016 M274: Some piston/wrist pin issues on early production — check service records.
    PROS: Timeless prestige, comfortable long-distance ride, excellent sound insulation, strong brand desirability, W205 is genuinely refined.
    CONS: Extremely expensive parts and labor; any repair at authorized dealer costs fortune; W204 has multiple known failure points; complex electronics; premium fuel (95+) always.
    USER FEEDBACK: "حلم كل شاب" — every young man's dream. "بتاكل فلوس في الصيانة" — eats money in maintenance. "محتاجة جيب ورا جيب" — same as BMW, needs deep pockets.
    BUYING ADVICE: W205 2017+ with 9G-Tronic and M274 engine is the safest choice. W204: check timing chain and ESL status thoroughly. Never buy any Mercedes without specialist inspection. Budget 25,000-40,000 EGP annually for proper maintenance.

mercedes_c200:
  notes: |
    KEY: Same notes as mercedes_c180 apply entirely. C200 and C180 share the same platform, engine family (M274 in newer, M271 in older), and all known issues. The C200 has slightly higher output but same maintenance considerations and risks.

mercedes_e180:
  notes: |
    EGYPT MARKET STATUS: The E-Class is one step above C-Class in prestige. W212 (2009-2016) and W213 (2016-present) are the main used market generations.
    APPLIES TO: E180, E200, E230, E250, E280, E300, E350 — all E-Class variants.
    ENGINE: 1.6L (E180), 2.0L Turbo (E200/E250), 2.2L diesel (some), 3.0L V6 (E300/E350).
    TRANSMISSION: 7G-Tronic or 9G-Tronic.
    KNOWN ISSUES: Similar to C-Class but at higher maintenance cost. E250 CGI had some injection system issues. W212 is more prone to rust on the lower body than W213.
    PRESTIGE LEVEL: Higher than C-Class. "راجل المناسبات" — the occasions man's car. Status for business and social events.
    PROS: More spacious than C-Class, quieter ride, more prestigious interior, strong executive presence.
    CONS: Even more expensive than C-Class to maintain; parts from authorized dealer are very costly; requires premium specialist.
    BUYING ADVICE: W213 post-2018 with 9G-Tronic is the reliability target. Never buy without specialist inspection. Budget 30,000-50,000 EGP annual maintenance for W213.

# ────────────────────────────────────────────────────────────────────────────
# AUDI
# ────────────────────────────────────────────────────────────────────────────

audi_a4:
  notes: |
    EGYPT MARKET STATUS: Premium German sedan, less common than BMW/Mercedes but with a loyal base. Quattro AWD is unique in this segment. B8 (2008-2015) and B9 (2015-2023) generations.
    ENGINE: 1.8T (B8), 2.0T (both generations — most common in Egypt).
    TRANSMISSION: Multitronic CVT (FWD B8 — problematic) or S-Tronic DSG (Quattro) or 7-speed S-Tronic (B9).
    CRITICAL KNOWN ISSUES:
      B8 2.0 TFSI: PISTON RING OIL CONSUMPTION — very widespread. Many B8 units consume 0.5-1L of oil per 1,000 km. Check oil level between visits. Piston ring replacement: 30,000-50,000 EGP.
      B8 Multitronic CVT (FWD): Failure risk on older units. Avoid FWD B8 Multitronic if possible.
      B8 Timing Chain: Chain tensioner failure — same catastrophic risk as BMW N20 if neglected. 
    PROS: Understated elegance, Quattro AWD gives genuine traction advantage, excellent interior quality, engaging to drive.
    CONS: Oil consumption on B8 is a known budget drain; DSG/CVT complexity; parts harder to find than BMW; specialist requirement; premium fuel always.
    USER FEEDBACK: "شكلها شيك بدون ضجة" — chic without noise (understated luxury). "بتاكل زيت" — it eats oil (B8 specific).
    BUYING ADVICE: B9 (2015+) is significantly more reliable than B8. If buying B8 — oil consumption test is mandatory: check oil level before and after test drive, and confirm history. Quattro preferred over FWD.

audi_q3:
  notes: |
    EGYPT MARKET STATUS: Growing presence in the premium compact SUV segment. Competes with BMW X1 and Mercedes GLA. Appeals to buyers wanting German SUV at more accessible price than Q5/Q7.
    ENGINE: 1.4T or 2.0T petrol. 2.0T is the one to get.
    TRANSMISSION: S-Tronic 7-speed DSG.
    KNOWN ISSUES: Same VW Group DSG concerns — mechatronic can fail, requires proper fluid service. 1.4T can have chain issues on older units.
    PROS: Premium Audi interior quality, good safety rating, practical dimensions for Cairo, Virtual Cockpit on newer units is impressive.
    CONS: Expensive parts and service; DSG in traffic; requires premium fuel; first-generation Q3 (2011-2018) has more issues than F3 generation (2019+).
    BUYING ADVICE: F3 generation Q3 (2019+) is the better buy — significantly improved interior and reliability. Pre-purchase inspection at Audi specialist mandatory.

# ────────────────────────────────────────────────────────────────────────────
# VOLKSWAGEN — Additional Coverage
# ────────────────────────────────────────────────────────────────────────────

volkswagen_tiguan:
  notes: |
    EGYPT MARKET STATUS: The German alternative to Tucson/Sportage. Solid build quality, refined driving. Less common than Korean rivals due to price but has devoted following.
    ENGINE: 1.4L TSI Turbo (most common in Egypt).
    TRANSMISSION: 7-speed DSG (dry DCT — same unit as Golf 7).
    KNOWN ISSUE: 7-speed dry DSG (DQ200) — the same transmission that caused issues in Golf. In Cairo heat and traffic, it can judder at low speeds and overheat. Extended warranty claims were common globally. The wet DSG (DQ250) found in higher-powered variants is more robust.
    PROS: Excellent build quality and road feel, spacious interior, good safety ratings, premium perception, VW reliability when maintained properly.
    CONS: DQ200 DSG risk; expensive parts and maintenance; requires premium 95 fuel; parts more expensive than Korean rivals; specialist required.
    USER FEEDBACK: "تقفيلها احلى من اي كوري" — its build quality is better than any Korean. "الفتيس DSG هو نقطة ضعفها الوحيدة" — the DSG gearbox is its only weak point.
    BUYING ADVICE: Ensure DSG was serviced every 60,000 km with VW-spec oil. Check for any DSG shudder complaints in history. Pre-purchase inspection at VW specialist. Post-facelift models (2017+) have improved DSG software.

volkswagen_jetta:
  notes: |
    EGYPT MARKET STATUS: The sedan sibling of the Golf. Less popular than Golf in Egypt but has market presence.
    ENGINE: 1.4L TSI Turbo.
    TRANSMISSION: 7-speed DSG.
    NOTES: All Golf 7 DSG concerns apply equally to Jetta. Sedan body makes it more practical than Golf for some families. Same maintenance requirements.

# ────────────────────────────────────────────────────────────────────────────
# RENAULT — Additional Models
# ────────────────────────────────────────────────────────────────────────────

renault_kadjar:
  notes: |
    EGYPT MARKET STATUS: European compact SUV sharing platform with Nissan Qashqai. French styling at competitive price. Less common than Korean rivals but growing.
    ENGINE: 1.3L Turbo (TCe) or 1.6L petrol depending on year.
    TRANSMISSION: 7-speed DCT (EDC) or 6-speed Manual.
    KNOWN ISSUE: 1.3L TCe engine timing chain can stretch prematurely on early production (2017-2019). Recognized issue globally — check for cold-start rattling.
    PROS: European ride comfort, decent interior quality, French design appeal, good safety features, more affordable than Qashqai.
    CONS: DCT can be hesitant; parts more expensive than Korean; 1.3T chain risk on early models; resale lower than Korean equivalents.
    BUYING ADVICE: 2019+ models with updated timing chain are safer. Manual version avoids DCT concerns. Get specialist inspection before buying.

renault_symbol:
  notes: |
    EGYPT MARKET STATUS: Budget sedan, very similar to Logan. The Symbol/Taliant are essentially Logan with a more car-like trunk. Popular in the budget segment.
    ENGINE: 1.0L or 1.6L petrol.
    TRANSMISSION: Manual (most common) or Automatic.
    NOTES: Same core mechanical DNA as Logan — cheap parts, simple maintenance. The 1.0L 3-cylinder turbo is very fuel efficient but some find it noisy.
    BUYING ADVICE: Same advice as Logan — good honest budget car, don't expect luxury.

# ────────────────────────────────────────────────────────────────────────────
# SUZUKI — Additional Coverage
# ────────────────────────────────────────────────────────────────────────────

suzuki_vitara:
  notes: |
    EGYPT MARKET STATUS: Reliable Japanese crossover with genuine off-road option (AllGrip AWD). Loyal following among buyers who want real 4WD on a budget.
    ENGINE: 1.4L Turbo BoosterJet or 1.6L petrol depending on year.
    TRANSMISSION: 6-speed Automatic or 5-speed Manual.
    AWD: AllGrip system — a genuine part-time AWD system, not just electronic traction control. Unique in its price segment in Egypt.
    PROS: Suzuki's renowned reliability, available genuine AWD (rare at this price point), good ground clearance, simple and durable, excellent for rough roads.
    CONS: Interior is basic and feels dated compared to Korean/Chinese rivals; rear seat space tight for tall adults; 1.6L can feel underpowered; not as feature-rich.
    USER FEEDBACK: "عربية بتستحمل" — a car that can endure. "جوها بسيط بس بتروح اي حته" — simple inside but goes anywhere. "بتاعة الشالية والساحل" — the chalet and coast car (implying off-road use).
    BUYING ADVICE: Excellent choice for those going to rough terrain or coastal areas. AWD version is the one to get — it's the unique selling point. Manual is more engaging and reliable.

suzuki_grand_vitara:
  notes: |
    EGYPT MARKET STATUS: Older generation Suzuki SUV. Still has market presence in used segment.
    ENGINE: 1.6L or 2.4L petrol.
    TRANSMISSION: Manual or Automatic. 4WD available.
    NOTES: Older tech but genuine off-road capability. Parts available from Suzuki network. Cheaper than newer Vitara used. Good for those wanting basic capable SUV on tight budget.

# ────────────────────────────────────────────────────────────────────────────
# MAZDA
# ────────────────────────────────────────────────────────────────────────────

mazda_3:
  notes: |
    EGYPT MARKET STATUS: Premium Japanese alternative to Corolla/Cerato. Strong enthusiast following. "سواقين العربيات" (car people) choose Mazda 3.
    ENGINE: 1.5L SkyActiv-G (Mazda 3 2014+) or 1.6L (older). SkyActiv is the important one.
    TRANSMISSION: 6-speed Automatic (torque converter — very reliable, not CVT or DSG).
    SKYACTIV ENGINE: The SkyActiv-G uses high compression ratio for fuel efficiency without turbo. Reliable but requires 95 octane for proper operation — using 92 long-term can cause carbon buildup.
    PROS: Best driving dynamics of any mainstream sedan (genuine steering feel and handling), premium Mazda interior quality, conventional reliable 6AT, good resale among enthusiasts, beautiful design.
    CONS: Parts more expensive and less available than Toyota/Hyundai; rear seat tight compared to Corolla; road noise higher than class average; requires 95 octane; no local assembly means parts import cost.
    USER FEEDBACK: "اكتر عربية بتحس انك بتسوق" — the car that makes you feel like you're actually driving. "صيانتها اغلى من الكورولا" — maintenance more expensive than Corolla.
    BUYING ADVICE: Buy 2014+ SkyActiv models. Find a mechanic who knows Mazda before buying — not every workshop is comfortable with them. Always use 95 octane. Check for accident history — body parts are expensive.

# ────────────────────────────────────────────────────────────────────────────
# HYUNDAI — Additional Coverage
# ────────────────────────────────────────────────────────────────────────────

hyundai_santa_fe:
  notes: |
    EGYPT MARKET STATUS: Large family SUV. Less common than Tucson but has loyal buyers.
    ENGINE: 2.4L petrol or 2.0T (turbo) depending on generation.
    TRANSMISSION: 6-speed or 8-speed Automatic.
    PROS: Genuinely large and spacious 7-seater capable (some trims), Hyundai reliability, strong resale for clean examples, comfortable for long trips.
    CONS: Expensive compared to Tucson; 2.0T parts more costly; fuel consumption high; some 2013-2015 models had theta II engine oil consumption concerns (check history).
    BUYING ADVICE: 2.4L NA is simpler and more reliable than 2.0T for Egyptian conditions. Check for any oil consumption issues on Theta II engine units.

hyundai_sonata:
  notes: |
    EGYPT MARKET STATUS: Executive sedan. Less common now, being phased out in favor of Elantra in many buyers' minds. Found mainly in used market.
    ENGINE: 2.0L or 2.4L petrol depending on generation.
    TRANSMISSION: 6-speed Automatic.
    NOTES: Larger than Elantra, good highway comfort. Parts available. Resale below Elantra due to declining new sales.

# ────────────────────────────────────────────────────────────────────────────
# NISSAN — Additional Coverage
# ────────────────────────────────────────────────────────────────────────────

nissan_xtrail:
  notes: |
    EGYPT MARKET STATUS: Popular compact SUV. Direct competitor to Kia Sportage and Hyundai Tucson.
    ENGINE: 2.0L petrol (older) or 1.3L DIG-T Turbo (newer T33 generation).
    TRANSMISSION: CVT or Manual.
    KNOWN ISSUE (1.3 DIG-T): The newer X-Trail with 1.3L turbo had timing chain issues globally — check for cold-start rattle. Early build (2021-2022) was more problematic than 2023+.
    PROS: Nissan reliability reputation, comfortable ride, spacious, available AWD on higher trims, strong resale.
    CONS: CVT requires maintenance; 1.3T chain concern on early units; parts pricier than Sunny/Sentra; fuel consumption higher than those.
    BUYING ADVICE: 2.0L older generation is simpler and more reliable. If buying new 1.3T, check for timing chain update.

nissan_livina:
  notes: |
    EGYPT MARKET STATUS: 7-seater MPV/crossover. Budget family vehicle.
    ENGINE: 1.6L petrol.
    TRANSMISSION: Automatic or Manual.
    PROS: 7 seats, Nissan reliability, practical, cheap to maintain.
    CONS: Underpowered, basic interior, dated design.

# ────────────────────────────────────────────────────────────────────────────
# SKODA — Generational Entries
# ────────────────────────────────────────────────────────────────────────────

skoda_octavia_a7:
  notes: |
    EGYPT MARKET STATUS: The third generation Octavia. Highly capable and refined. DSG is the main concern for Egyptian buyers.
    GENERATION: 2013-2020.
    ENGINE: 1.2T or 1.4T or 2.0T petrol.
    TRANSMISSION: DSG (DQ200 dry 7-speed on 1.2T/1.4T) or DSG (DQ250 wet 6-speed on 2.0T).
    DSG CRITICAL NOTE: 1.4T with DQ200 (dry DSG) — this is the problematic combination for Egyptian heat and traffic. The DQ200 mechatronic can overheat and fail in prolonged traffic. Cost: 25,000-50,000 EGP.
    The 2.0T with DQ250 (wet DSG) is significantly more robust.
    PROS: Excellent build quality, very spacious, mature driving dynamics, upscale interior.
    BUYING ADVICE: Target the 2.0T with wet DSG if at all possible. If buying 1.4T: verify DSG service history is complete (oil + filter every 60k km). Any 1.4T without documented DSG service is a risk.

skoda_octavia_a8:
  notes: |
    EGYPT MARKET STATUS: Latest Octavia generation. Most refined. Some variants use the Aisin 8-speed torque converter — a relief after DSG concerns.
    GENERATION: 2020-present.
    ENGINE: 1.0T, 1.5T, 2.0T petrol.
    TRANSMISSION: 7-speed DSG (1.0T/1.5T) or 8-speed Aisin Automatic (2.0T on some variants).
    AISIN NOTE: The 8-speed Aisin on the 2.0T A8 is a conventional torque-converter automatic — much more forgiving in traffic than DSG. This is the "peace of mind" trim.
    PROS: Most refined Octavia ever, very large interior, excellent feature set, improved safety.
    CONS: Very expensive new; DSG on lower trims still concerns; parts require specialist.
    BUYING ADVICE: If budget allows, the 2.0T with Aisin is the definitive used Skoda for Egyptian conditions.

skoda_superb:
  notes: |
    EGYPT MARKET STATUS: Premium large sedan. Skoda's flagship. Less common but highly regarded.
    ENGINE: 1.8T or 2.0T petrol.
    TRANSMISSION: DSG.
    NOTES: Enormous interior — genuinely VW Passat-class space at lower price. DSG concerns apply. Prestigious without the VW badge premium.


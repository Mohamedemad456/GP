geely_cool_ray:
  notes: |
    EGYPT MARKET STATUS: Stylish compact crossover competing with MG ZS and Hyundai Creta. Geely's Volvo DNA helps design and safety perception.
    ENGINE: 1.5L Turbo petrol, ~177 hp.

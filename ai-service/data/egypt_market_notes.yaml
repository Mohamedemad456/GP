# ────────────────────────────────────────────────────────────────────────────
# GENERAL EGYPTIAN MARKET NOTES
# ────────────────────────────────────────────────────────────────────────────

general_market_trends:
  notes: |
    CONDITION GRADING (most important concept in Egyptian used car market):
      - فابريكا (Fabrica): Original factory paint everywhere. No repaints, no accidents. Commands maximum price. The gold standard.
      - رش حزام (Rash Hizam): Exterior panels repainted (doors, fenders, bumpers) — cosmetic refresh. Minor concern, slightly lowers price. Acceptable if documented.
      - رش بره نظافة: Full exterior respray for cosmetic refresh. Body is structurally sound but fully resprayed. Lower price, not necessarily a red flag.
      - رش دواخل (Rash Dawakhel): MAJOR RED FLAG. Structural/chassis repairs. Avoid at any price. Permanent safety concern.
      - الدواخل (Dawakhel): Frame, chassis, A/B/C pillars, floor — the structural skeleton. فابريكا دواخل is the critical phrase to confirm.

    SPARE PARTS ECONOMICS:
      Cheapest to most expensive (rough ranking for common cars):
      Lanos ≈ Verna (cheapest) → Logan → Sunny → Elantra → Corolla → Cerato/Sentra → Tucson/Sportage → European brands (most expensive)

    FUEL TYPES IN EGYPT PRACTICE:
      - Most Egyptians use 92 octane (the standard).
      - European/performance cars and turbo engines should use 95 octane minimum.
      - CNG (natural gas) conversions are extremely common — reduces fuel cost significantly but: slightly reduces performance, requires certified conversion, CVT cars should NOT be converted to CNG (damages CVT over time).
      - Diesel: available but quality varies by station — critical for European diesel engines.

    CHINESE CARS PERCEPTION SHIFT (2019-present):
      There has been a dramatic shift. Pre-2019: "عربية صيني = هتعمل مشاكل". Post-2019: MG ZS, Haval Jolion, newer Chery Pro lineup changed perception. Chinese cars are now mainstream. Long-term (10+ year) reliability still unproven compared to Japanese 20-year track record.

    # APRIL 2026 REALITY (TIME-SENSITIVE):
    #   - Pricing is extremely volatile. There is often a big gap between official agent prices and real market prices ("overprice" / parallel market).
    #   - Do NOT quote exact prices unless the user provides a very recent listing. Prefer: "prices change daily — check Hatla2ee / ContactCars and tell me your budget + the exact listing".
    #   - EVs and Chinese brands are no longer niche in Cairo/Giza compounds; treat BYD/MG/Chery Pro as mainstream competitors when discussing newer cars.

    KEY INSPECTION POINTS FOR ANY USED CAR:
      1. Body: الدواخل فابريكا (frame must be factory)
      2. Engine: Check for smoke, oil leaks, timing belt/chain condition
      3. Transmission: CVT/DSG — ask for service records specifically
      4. Suspension: عفشة — listen for knocking at low speed over bumps
      5. AC: Test AC at maximum — weak AC in Egypt is a deal-breaker
      6. Electrics: Test ALL windows, locks, screens, sensors

    RESALE VALUE RANKING (best to worst, general guidance):
      Toyota Corolla > Toyota Fortuner > Kia Cerato > Hyundai Elantra HD > Nissan Sunny N17 > Honda Civic > Kia Sportage > Hyundai Tucson > Renault Duster > Chevrolet Optra (old) > Chinese brands (varies by brand/model; improving fast)

    BEST VALUE FOR DIFFERENT BUDGETS (general guidance only, prices change with currency):
      - Extreme budget: Chevrolet Lanos, Hyundai Verna (city only), Renault Logan
      - Budget family: Hyundai Elantra HD (used), Nissan Sunny N17, Renault Logan auto
      - Mid budget: Kia Cerato K3/Grand, Hyundai Elantra AD/CN7, Toyota Yaris
      - Good budget: Toyota Corolla, Kia Sportage, Nissan Sentra
      - SUV entry: Renault Duster, Kia Sportage, Hyundai Tucson, MG ZS
      - Premium: Honda Civic, Skoda Octavia A7+, Volkswagen Golf 7

    AC PERFORMANCE NOTE:
      AC performance is critical in Egypt (Cairo summer reaches 40°C+). Always test AC when buying used. Models with weaker AC stock: some older Peugeots, Renault Logan in traffic. Models with excellent AC: Nissan Sunny N17 (famous for strong AC), modern Hyundai/Kia, Toyota Corolla.

    RIDE-HAILING POPULAR MODELS (Uber/Careem/inDrive):
      Top picks based on running costs and passenger acceptance:
      1. Nissan Sunny N17 (most popular ride-hailing car)
      2. Hyundai Elantra HD
      3. Toyota Corolla
      4. Kia Cerato
      5. Hyundai Verna (budget drivers)